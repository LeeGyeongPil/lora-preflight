[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lora-preflight"
version = "0.2.0"
description = "Check a PEFT LoRA adapter against vLLM, llama.cpp and Ollama before you serve it. No GPU, no weight download."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["lora", "peft", "vllm", "llama.cpp", "ollama", "safetensors", "preflight"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/lora-preflight"
Issues = "https://github.com/LeeGyeongPil/lora-preflight/issues"

[project.scripts]
lora-preflight = "lora_preflight.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lora_preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
